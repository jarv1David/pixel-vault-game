<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Vault Arcade</title>
    <!-- SDK Oficial de Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        h1 {
            font-size: 26px;
            text-shadow: 2px 2px #ff0055;
            margin-bottom: 5px;
        }
        p {
            color: #aaaaaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .score-board {
            font-size: 36px;
            margin: 20px 0;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffcc;
        }
        .coin-btn {
            background: #ff0055;
            border: 4px solid #00ffcc;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            font-size: 70px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 20px #ff0055;
            transition: transform 0.05s, box-shadow 0.05s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .coin-btn:active {
            transform: scale(0.90);
            box-shadow: 0 0 30px #00ffcc;
        }
        .footer-info {
            margin-top: 30px;
            font-size: 12px;
            color: #ff0055;
        }
    </style>
</head>
<body>

    <h1>🕹️ PIXEL VAULT 👾</h1>
    <p>Toca la ficha para recolectar $PIXEL</p>

    <div class="score-board">
        🪙 <span id="score">0</span>
    </div>

    <button class="coin-btn" id="tapBtn">👾</button>

    <div class="footer-info">FASE DE FARMEO ACTIVA</div>

    <script>
        // Inicializar SDK de Telegram
        const tg = window.Telegram.WebApp;
        tg.expand(); // Abre la ventana en pantalla completa en Telegram

        let count = 0;
        const scoreEl = document.getElementById('score');
        const tapBtn = document.getElementById('tapBtn');

        tapBtn.addEventListener('click', () => {
            count += 1;
            scoreEl.innerText = count;

            // Vibración táctil si el dispositivo/Telegram lo soporta
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        });
    </script>
</body>
</html>
